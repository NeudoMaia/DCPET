# ============================================================
# Bloco Nginx para o DCPET na VM SEPOG (172.31.3.60)
# Inserir no bloco server { listen 80; ... } da VM
# ============================================================

# 1. Rota do Frontend do DCPET
location /dcpet/ {
    resolver 127.0.0.11 valid=30s;
    set $upstream_dcpet http://dcpet-app:3005/;
    proxy_pass $upstream_dcpet;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2. Redirecionamento da rota sem barra no final
location = /dcpet {
    return 301 /dcpet/;
}
